name: Update microfat
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional exact latest stable tag; empty discovers latest
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: microfat-release-update
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'EpicBlackWolfZ/homebrew-tap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate reviewed upstream pin
        id: pin
        run: |
          read -r ref < microfat-tools.ref
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EpicBlackWolfZ/microfat
          ref: ${{ steps.pin.outputs.ref }}
          path: microfat-tools
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: microfat-tools/go.sum
      - name: Discover eligible public release
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          latest=$(cd microfat-tools && go run ./internal/cmd/homebrew-release discover)
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$latest" ]; then
            echo 'Requested tag is not the latest eligible public stable release.' >&2
            exit 1
          fi
          if [ -z "$latest" ]; then
            echo 'No eligible release: the first cask requires published v0.3.0 assets.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          current=""
          if [ -f Casks/microfat.rb ]; then
            current=$(sed -n 's/^  version "\([0-9.]*\)"$/v\1/p' Casks/microfat.rb)
          fi
          if [ "$current" = "$latest" ]; then
            echo "The tap already contains $latest." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
      - name: Authenticate complete inventory and generate candidate
        if: steps.select.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
        run: |
          mkdir -p .work
          cp microfat-tools.ref .work/tooling-source.txt
          output="$PWD/.work/candidate"
          cd microfat-tools
          go run ./internal/cmd/homebrew-release prepare --tag "$RELEASE_TAG" --output "$output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.select.outputs.tag != ''
        with:
          name: microfat-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .work/candidate/microfat.rb
            .work/candidate/verification.json
      - name: Retain preparation evidence
        if: always() && steps.select.outputs.tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microfat-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            .work/tooling-source.txt
            .work/candidate/verification.json
            .work/candidate/commands.jsonl
  qualify:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/qualify-microfat.yml
    with:
      candidate-artifact: microfat-candidate-${{ github.run_id }}-${{ github.run_attempt }}
  propose:
    needs: [prepare, qualify]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate reviewed upstream pin
        id: pin
        run: |
          read -r ref < microfat-tools.ref
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EpicBlackWolfZ/microfat
          ref: ${{ steps.pin.outputs.ref }}
          path: microfat-tools
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: microfat-tools/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: microfat-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/candidate
      - name: Reauthenticate and propose only the microfat cask
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh auth setup-git
          bash scripts/propose-microfat.sh "$RELEASE_TAG" .work/candidate microfat-tools
